name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # BlitzForge submodule; nested reshade deps are not needed for
          # compile/test so we skip recursive to keep the checkout fast.
          submodules: true

      # This diagnostic is only needed for the intermittent graphics launch
      # investigation, so parse it here without launching the probe or a game.
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/gfxprobe_loop.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      # Cache the BlitzForge runtime binaries keyed on the submodule SHA.
      # rcce2 PRs rarely change the BlitzForge pointer, so the common-case
      # CI run avoids the ~3min MSBuild step entirely.
      - name: Resolve BlitzForge submodule SHA
        id: bf
        shell: bash
        run: echo "sha=$(git -C compiler/BlitzForge rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore BlitzForge bin from cache
        id: bf-cache
        # actions/cache@v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            compiler/BlitzForge/bin/blitzcc.exe
            compiler/BlitzForge/bin/runtime.dll
            compiler/BlitzForge/bin/linker.dll
            compiler/BlitzForge/bin/debugger.dll
          key: blitzforge-bin-${{ runner.os }}-${{ steps.bf.outputs.sha }}

      - name: Add MSBuild to PATH
        if: steps.bf-cache.outputs.cache-hit != 'true'
        # microsoft/setup-msbuild@v2
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

      - name: Build BlitzForge compiler
        if: steps.bf-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: compiler/BlitzForge
        run: |
          call compile.bat
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify BlitzForge binaries are present
        shell: cmd
        run: |
          if not exist compiler\BlitzForge\bin\blitzcc.exe (
            echo blitzcc.exe missing after build/restore
            exit /b 1
          )

      - name: Compile project
        shell: cmd
        run: |
          call compile.bat
          if errorlevel 1 exit /b %errorlevel%

      - name: Run test suite
        shell: cmd
        run: test.bat

      # The Rust client (client-rs/) ships its own deterministic unit + parser
      # robustness tests. Select the repository MSRV instead of relying on the
      # mutable toolchain preinstalled on windows-latest.
      # Gate ALL four logic crates on every PR:
      #   - rcce-data / rcce-net: parsers + wire codec — the "soft-fail, never
      #     panic on hostile input" invariant must not regress.
      #   - rcce-render / rcce-client: despite pulling wgpu/winit, they carry
      #     ~150 PURELY HEADLESS unit tests (overlay projection math, world.rs
      #     packet-handler regressions, HUD/menu geometry, the EnetTransport Send
      #     contract, etc.) that run with no GPU/window in <1s. Compiling them
      #     here also makes CI catch a build break in the client/renderer (the
      #     crates the project changes most) on a fresh checkout. The one-time
      #     wgpu/winit compile is amortised by the cache step below (which already
      #     lists client-rs/target). The i686-only rcenet-ffi-probe is excluded.
      - name: Set up Rust 1.85.0 (client)
        # dtolnay/rust-toolchain@1.85.0
        uses: dtolnay/rust-toolchain@98effd2fc0b766278e30ab86762dd5e9a8531399
        with:
          components: clippy

      - name: Report Rust toolchain (client)
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust build (client-rs)
        # actions/cache@v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            client-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('client-rs/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Exercise the Windows release wrapper, including its copies to the
      # shipped bin paths; crate-level tests below cannot cover that contract.
      - name: Package Rust apps for Windows
        shell: cmd
        run: |
          call compile.bat -e -t -r
          if errorlevel 1 exit /b %errorlevel%
          if not exist bin\ClientRS.exe (
            echo ClientRS.exe missing after Rust packaging
            exit /b 1
          )
          if not exist bin\ServerRS.exe (
            echo ServerRS.exe missing after Rust packaging
            exit /b 1
          )

      - name: Run Rust client tests (logic crates)
        shell: bash
        working-directory: client-rs
        run: cargo test -p rcce-data -p rcce-net -p rcce-render -p rcce-client --locked

      # Clippy gate over the four tested crates plus their vendored enet-sys
      # transport (lib + bins + tests via --all-targets), failing on ANY lint
      # (`-D warnings`). enet-sys is included explicitly so the gate is
      # deterministic: it's a path-dep of rcce-net, so on a cache MISS clippy
      # would lint it anyway — gating it directly means a green run can't depend
      # on whether the cache happened to skip it. The workspace allows three
      # lints that fight idiomatic graphics/parser code (too_many_arguments,
      # type_complexity, field_reassign_with_default — see client-rs/Cargo.toml
      # [workspace.lints.clippy]); everything else is denied. The i686-only
      # rcenet-ffi-probe is excluded (CI is x86_64). This gate already caught
      # two real correctness bugs (a dead `|| true` find-predicate and an
      # approximate-TAU literal).
      - name: Clippy (Rust client logic crates)
        shell: bash
        working-directory: client-rs
        run: cargo clippy -p rcce-data -p rcce-net -p rcce-render -p rcce-client -p enet-sys --all-targets --locked -- -D warnings

      # Two reference docs (the wire-protocol packet catalog and the BVM
      # scripting-API catalog) are produced by generator scripts that read
      # line numbers + signatures out of the source. Their `--check` mode
      # exits non-zero when the committed doc no longer matches a fresh
      # regeneration. Without this gate, every PR that shifts a packet
      # handler or BVM function silently leaves stale `:LINE` references
      # in the docs -- and the line numbers look authoritative because the
      # docs carry a "Do not edit by hand -- rerun the generator" banner.
      # Contributors who touch ServerNet.bb / ClientNet.bb / Packets.bb /
      # RC_Standard_Invoker.bb / ScriptingCommands.bb must rerun the two
      # generators (`bash scripts/gen_packet_index.sh` +
      # `bash scripts/gen_bvm_reference.sh`) and commit the regenerated
      # output, or this step fails the PR with a diff message pointing at
      # the regeneration command.
      - name: Verify generated docs are up to date
        shell: bash
        run: |
          bash scripts/gen_packet_index.sh --check
          bash scripts/gen_bvm_reference.sh --check

  # The headless Rust server (server-rs/) — the Linux-container production target
  # (bin/Server.exe drop-in). Gated on its DEPLOY OS (ubuntu) so the cfg(unix)
  # graceful-shutdown path + the production build are actually exercised, and the
  # full test suite (real-ENet login/e2e, BVM/script engine, world/NPC AI, the
  # 2-player marriage ceremony) runs on every PR. Path-deps the shared client-rs
  # crates (enet-sys/rcce-net/rcce-data) from the same checkout — no submodules.
  rust-server:
    name: Rust server (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate Unix shell syntax
        shell: bash
        run: bash -n compile.sh test.sh scripts/*.sh

      - name: Set up Rust 1.85.0 (server)
        # dtolnay/rust-toolchain@1.85.0
        uses: dtolnay/rust-toolchain@98effd2fc0b766278e30ab86762dd5e9a8531399
        with:
          components: clippy

      - name: Report Rust toolchain (server)
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust build (server-rs)
        # actions/cache@v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            server-rs/target
          key: cargo-server-${{ runner.os }}-${{ hashFiles('server-rs/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-server-${{ runner.os }}-

      # The Unix wrapper is the release-facing contract: it builds both Rust
      # apps with their lockfiles and copies the shipped binaries into bin/.
      # rcce-client links CPAL's native ALSA backend on Linux, so install its
      # development metadata before exercising that real release path.
      - name: Install Linux audio build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev

      - name: Package Rust apps for Linux
        shell: bash
        run: |
          ./compile.sh -e -t -r
          test -x bin/ClientRS
          test -x bin/ServerRS

      - name: Build + test (server workspace, locked)
        working-directory: server-rs
        run: cargo test --workspace --locked

      - name: Build Rust server Docker image
        run: docker build -f server-rs/Dockerfile -t rcce-server .

      - name: Smoke-test Rust server Docker startup
        shell: bash
        run: |
          set -euo pipefail
          container_name=rcce-server-smoke
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container_name" -p 25000:25000/udp -v "$GITHUB_WORKSPACE/data:/data:ro" rcce-server

          ready=false
          for attempt in $(seq 1 30); do
            if docker logs "$container_name" 2>&1 | grep -Fq "Listening on UDP 25000."; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Rust server Docker smoke test did not reach UDP readiness"
            docker logs "$container_name" || true
            exit 1
          fi

      - name: Clippy (server workspace, -D warnings)
        working-directory: server-rs
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
