[workspace]
resolver = "2"
members = [
    "crates/rcce-server-net",
    "crates/rcce-server-core",
    "crates/rcce-server-accounts",
    "crates/rcce-script",
    "crates/rcce-server",
]

# Phase plan — see docs/rust-server/PLAN.md. Crates are added as each phase
# begins so the workspace always builds:
#   rcce-server-net      — ENet HOST wrapper (listen, N peers, poll→events)   [Phase 0, current]
#   rcce-server-accounts — accounts/auth/character flat-file persistence       [Phase 1]
#   rcce-server-core     — actors/areas/inventories/items/spells/environment   [Phase 2+]
#   rcce-script          — BVM bytecode engine + BVM_* command library         [Phase 4]
#   server               — the `rcce-server` binary, drop-in Server.exe         [Phase 0]
#
# Shared wire/format crates live in the sibling client-rs workspace and are
# pulled by path dependency so a single edit cannot desync the client and
# server views of the wire/on-disk formats:
#   ../client-rs/crates/enet-sys   — vendored RCCE2 ENet fork (host + client)
#   ../client-rs/crates/rcce-net   — wire codec + framing
#   ../client-rs/crates/rcce-data  — on-disk .dat/B3D/area/save parsers

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
enet-sys = { path = "../client-rs/crates/enet-sys" }
rcce-net = { path = "../client-rs/crates/rcce-net" }
rcce-data = { path = "../client-rs/crates/rcce-data" }

# Mirror client-rs: allow the three lints that fight idiomatic wire/parser code
# (many-field packet encoders, handle/result tuples, default-then-fill structs);
# everything else is denied via `-D warnings` in CI.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
field_reassign_with_default = "allow"
