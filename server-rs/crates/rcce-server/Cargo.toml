[package]
name = "rcce-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RCCE2 headless authoritative server (Rust) — drop-in for bin/Server.exe, Linux-container deployable."

[[bin]]
name = "rcce-server"
path = "src/main.rs"

[dependencies]
rcce-server-net = { path = "../rcce-server-net" }
rcce-server-accounts = { path = "../rcce-server-accounts" }
rcce-server-core = { path = "../rcce-server-core" }
rcce-script = { path = "../rcce-script" }
rcce-net.workspace = true
# Shared on-disk parsers — Fixed Attributes.dat (Health/Speed stat slot indices).
rcce-data.workspace = true

# Unix signal handling for graceful shutdown (SIGTERM on container stop → final
# account flush). Already resolved in Cargo.lock transitively; no new crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Real ENet client transport, for the end-to-end login test (a genuine ENet
# handshake against our host + framing + handlers — not a mock).
enet-sys.workspace = true
rcce-net.workspace = true

[lints]
workspace = true
