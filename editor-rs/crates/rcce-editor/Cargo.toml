[package]
name = "rcce-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Desktop composition boundary for the RCCE Rust editor."

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
rcce-editor-core.workspace = true

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.15.4", default-features = false, features = ["common-controls-v6"] }

[lints]
workspace = true
