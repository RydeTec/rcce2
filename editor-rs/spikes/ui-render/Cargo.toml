[workspace]

[package]
name = "rcce-ui-render-spike"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
bytemuck = { version = "=1.25.0", features = ["derive"] }
egui = "=0.29.1"
egui-wgpu = { version = "=0.29.1", default-features = false }
egui-winit = { version = "=0.29.1", default-features = false, features = ["accesskit", "wayland", "x11"] }
env_logger = "=0.11.8"
log = "=0.4.30"
pollster = "=0.3.0"
rcce-render = { path = "../../../client-rs/crates/rcce-render" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
wgpu = "=22.1.0"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.15.4", default-features = false, features = ["common-controls-v6"] }
windows-sys = { version = "=0.59.0", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
