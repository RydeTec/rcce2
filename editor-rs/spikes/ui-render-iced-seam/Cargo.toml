[workspace]

[package]
name = "rcce-ui-render-iced-seam"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
iced = { version = "=0.13.1", default-features = false, features = ["wgpu"] }
iced_wgpu = { version = "=0.13.5", default-features = false }
rcce-render = { path = "../../../client-rs/crates/rcce-render" }
wgpu22 = { package = "wgpu", version = "=22.1.0" }

[dev-dependencies]
trybuild = "=1.0.116"

[lints.rust]
unsafe_code = "deny"
