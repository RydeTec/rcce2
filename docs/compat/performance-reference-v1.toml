[protocols.cache]
status = "unvalidated"
cold_definition = "A run after an OS-reboot or a recorded, platform-valid cache reset that removes prior fixture data from the relevant filesystem cache; process restart alone is insufficient."
warm_definition = "A run immediately after one complete untimed fixture-open and trace replay on the same machine, storage path, build, and fixture."
reset_command_template = "<record exact approved Windows cache-reset or reboot procedure and observed completion>"
evidence_ids = []

[protocols.memory]
status = "unvalidated"
metrics = ["peak_working_set_bytes", "steady_state_working_set_bytes"]
sample_interval_ms = 100
steady_window_seconds = 30
command_template = "<validated harness> --scenario <open|idle|interaction> --sample-memory-ms 100 --steady-window-seconds 30 --output <raw-samples.json>"
evidence_ids = []

[protocols.commit]
status = "deferred"
phase = "pre-write-m2"
semantic_requirement = "Measure the first representative implementation of ADR-0005 commit planning, flush, precondition recheck, replacement, directory durability, journal transitions, and recovery classification on approved fixtures and machines."
command_template = "<M2 commit harness> --fixture <content-sha256> --machine <machine-id> --cache <cold|warm> --output <raw-samples.json>"
prohibition = "A raw copy, rename, fsync, or synthetic filesystem microbenchmark cannot substitute for the representative ADR-0005 commit path."
evidence_ids = []

